# Render's free plan puts the API to sleep after 15 minutes without traffic,
# and a sleeping instance loses its local SQLite data when it restarts.
# Pinging /health every 10 minutes keeps it awake.
#
# Setup: Settings → Secrets and variables → Actions → Variables → add
# API_URL = https://<your-service>.onrender.com
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/health"
